<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLTES Orientation 2026 – Timetable Planner</title>
<style>
:root{--a:#0f5257;--g:#d9a21b;--bg:#eef2f1;--ink:#1b2a2f;--ln:#c8d3d1}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--a);color:#fff;padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-bottom:4px solid var(--g)}
h1{font-size:17px;margin:0}h1 small{display:block;font-weight:400;opacity:.8;font-size:12px}
h2{font-size:15px;margin:0 0 8px}
nav,.hb,.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
main{padding:14px 18px;max-width:1500px;margin:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:#fff;color:var(--ink);border-radius:5px;padding:5px 10px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--g);outline-offset:1px}
nav button.on,.bar button.on{background:var(--g);border-color:var(--g);font-weight:600}
.pri{background:var(--a);color:#fff;border-color:var(--a)}
.bar{margin-bottom:8px}.sp{flex:1}
.card{background:#fff;border:1px solid var(--ln);border-radius:6px;padding:12px 14px;margin-bottom:12px}
.card label{margin-right:16px}.hint{color:#5a6b6f;font-size:12px;margin:6px 0 0}
table.t{border-collapse:collapse;width:100%;background:#fff}
.t th,.t td{border:1px solid var(--ln);padding:4px 6px;vertical-align:top;text-align:left}
.t th{background:#e2ebe9;font-weight:600}.t td input:not([type]),.t td input[type=text]{width:100%}
textarea{width:100%;min-height:70px;font:inherit;border:1px solid var(--ln);border-radius:4px;padding:4px}
.chip{display:inline-flex;align-items:center;gap:2px;background:#e2ebe9;border-radius:12px;padding:1px 2px 1px 9px;margin:0 4px 4px 0}
.chip button{border:0;background:none;padding:0 6px;color:#a33}
.tt{min-width:900px;table-layout:fixed}.tt .tm{width:120px}
.tt td{padding:4px}.tt select,.tt input{width:100%;font-size:12px;margin-bottom:2px;border:1px solid var(--ln);border-radius:3px;padding:2px;background:#fff}
.fx th,.fx td{background:#f6f8f7;color:#4a5b5f;font-size:12px;font-weight:400}
td.cf{outline:2px solid #c0392b;outline-offset:-2px}.w{color:#c0392b;font-size:11px}
td.offd{background:#ddd;color:#666;text-align:center;font-size:12px}
.off{font-weight:400;font-size:11px}th small{font-weight:400}
.lc{font-size:11px;text-align:center;padding:2px}
.ok{background:#d8efdc}.ov{background:#fbe9b7}
input[type=number]{width:80px}.held{font-size:11px;display:flex;gap:3px;align-items:center}.tt .held input{width:auto;margin:0}
.pg{height:6px;background:#e2ebe9;border-radius:3px;overflow:hidden;margin-top:3px}.pg i{display:block;height:100%;background:var(--a)}
@media print{header,.noprint{display:none}main{padding:0}.tt select,.tt input{border:0;appearance:none;-webkit-appearance:none}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body>
<header><h1>SLTES Orientation Programme 2026 – Open Batch<small>Six-month timetable planner for 7 training centres</small></h1>
<nav><button data-v="setup">1 Setup</button><button data-v="asg">2 Lecturers by topic</button><button data-v="tt">3 Timetable</button><button data-v="prog">4 Centre progress</button><button data-v="lec">5 Lecturer view</button><button data-v="sum">6 Hours summary</button></nav>
<div class="hb"><button data-act="exp">Export to Excel</button><button data-act="imp">Import from Excel</button><button data-act="rst">Reset</button><input type="file" id="imp" hidden accept=".xlsx,.xls,.csv"></div></header>
<main id="app"></main>
<script>
const T=[["Teacher Educator as a Professional",42],["Sociological Background of Education",45],["Guidance & Counselling",54],["Technology for Education",87],["Educational Law, Admin & Mgmt",54],["Psychological Foundations of T-L",63],["Curriculum, Measurement & Evaluation",40],["Teacher Educator as a Researcher",51],["T-L Methods & Techniques",75]];
const NC=7;const SL=[["09:00–10:30","Session 01",1.5],["11:00–12:30","Session 02",1.5],["13:30–16:30","Session 03",3],["17:30–20:30","Night Session",3]];
const FX={0:[["08:00–09:00","Morning Assembly / Reflection and Thought of the Day"]],1:[["10:30–11:00","Morning Tea Break"]],2:[["12:30–13:30","Lunch"]],3:[["16:30–17:30","Evening Refreshment and Break"]]};
const $=s=>document.querySelector(s),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='sltes2026-timetable-v3';
const fresh=()=>({start:'2026-11-02',weeks:20,sat:false,cur:{c:0,w:0},view:'setup',off:{},s:{},nid:1,L:[],
 C:['A','B','C','D','E','F','G'].map(x=>({n:'Training Centre '+x,m:'',p:''})),A:[...Array(NC).keys()].map(()=>T.map(()=>[])),P:[...Array(NC).keys()].map(()=>T.map(()=>({h:0,r:''})))});
let S=fresh();
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(x){}
while(S.C.length<NC)S.C.push({n:'Training Centre '+'ABCDEFG'[S.C.length],m:'',p:''});while(S.A.length<NC)S.A.push(T.map(()=>[]));S.P=S.P||[];while(S.P.length<NC)S.P.push(T.map(()=>({h:0,r:''})));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}};
const nd=()=>S.sat?6:5,k=(c,w,d,i)=>[c,w,d,i].join('|');
const ln=id=>(S.L.find(x=>x.id===id)||{n:'?'}).n;
const act=()=>S.L.filter(l=>l.n.trim()).map(l=>l.id);
const addL=n=>{const id=S.nid++;S.L.push({id,n});return id};
const dt=(w,d)=>{const x=new Date(S.start+'T00:00:00');x.setDate(x.getDate()+w*7+d);return x};
const fd=(x,wd)=>x.toLocaleDateString('en-GB',wd?{weekday:'short',day:'2-digit',month:'short'}:{day:'2-digit',month:'short',year:'numeric'});
const col=t=>t>=0&&t<9?`background:hsl(${t*40} 55% 93%)`:'';
const pool=(c,t)=>t>=0&&t<9?S.A[c][t].filter(id=>act().includes(id)):[];
function lecBusy(w,d,i,l,ex){for(let c=0;c<NC;c++)if(c!==ex&&S.s[k(c,w,d,i)]?.l===l)return S.C[c].n;return''}
const heldH=(c,t)=>{let h=0;for(const K in S.s){const o=S.s[K];if(o.h&&o.t===t){const p=K.split('|').map(Number);if(p[0]===c&&p[3]<SL.length)h+=SL[p[3]][2]}}return h};
const cov=(c,t)=>heldH(c,t)+(+S.P[c][t].h||0);
function vProg(){const c=S.cur.c,C=S.C[c],sch=T.map(()=>0),f=x=>+x.toFixed(2);
 for(const K in S.s){const o=S.s[K],p=K.split('|').map(Number);if(p[0]===c&&o.t>=0&&o.t<9&&p[3]<SL.length)sch[o.t]+=SL[p[3]][2]}
 const sum=fn=>f(T.reduce((a,x,t)=>a+fn(x,t),0));
 return cbar()+`<div class="card"><b>${e(C.n)}</b> | Centre manager: ${e(C.m||'not set')}<p class="hint">The centre manager ticks “Session held” on the timetable for each session conducted, or enters extra hours covered here. Covered hours and status update automatically.</p></div>
<div class="bar noprint"><button onclick="print()">Print</button></div>
<table class="t"><tr><th>Topic<th>Required h<th>Scheduled h<th>Held (timetable) h<th>Extra hours (manual)<th>Covered h<th>Remaining h<th>Status<th>Remarks</tr>${T.map((x,t)=>{const cv=cov(c,t),st=cv<=0?'Not started':cv>=x[1]?'Completed':'In progress';
 return `<tr><td>T${t+1} ${e(x[0])}<td>${x[1]}<td>${f(sch[t])}<td>${f(heldH(c,t))}<td><input type="number" min="0" step="0.25" data-p="${c}|${t}" data-f="h" value="${S.P[c][t].h||0}"><td>${f(cv)}<div class="pg"><i style="width:${Math.min(100,cv/x[1]*100)}%"></i></div><td>${f(Math.max(0,x[1]-cv))}<td class="${st==='Completed'?'ok':st==='In progress'?'ov':''}">${st}<td><input data-p="${c}|${t}" data-f="r" value="${e(S.P[c][t].r||'')}" placeholder="Remarks"></tr>`}).join('')}<tr><th>Total<th>${sum(x=>x[1])}<th>${sum((x,t)=>sch[t])}<th>${sum((x,t)=>heldH(c,t))}<th><th>${sum((x,t)=>cov(c,t))}<th>${sum((x,t)=>Math.max(0,x[1]-cov(c,t)))}<th><th></tr></table>`}
function R(){S.weeks=Math.max(1,Math.min(30,S.weeks));S.cur.w=Math.min(S.cur.w,S.weeks-1);save();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
 $('#app').innerHTML={setup:vSetup,asg:vAsg,tt:vTT,prog:vProg,lec:vLec,sum:vSum}[S.view]()}
const cbar=()=>`<div class="bar noprint">${S.C.map((x,i)=>`<button data-go="c" data-i="${i}" class="${i===S.cur.c?'on':''}">${e(x.n)}</button>`).join('')}</div>`;
function wbar(){const w=S.cur.w;return `<button data-go="w" data-i="${w-1}">◀</button><select id="wsel">${[...Array(S.weeks).keys()].map(i=>`<option value="${i}" ${i===w?'selected':''}>Week ${i+1} (${fd(dt(i,0))})</option>`).join('')}</select><button data-go="w" data-i="${w+1}">▶</button>`}
function vSetup(){return `<section class="card"><h2>Programme settings</h2>
<label>Start date (Monday) <input type="date" id="st" value="${S.start}"></label>
<label>Weeks <input type="number" id="wk" min="1" max="30" value="${S.weeks}" style="width:64px"></label>
<label><input type="checkbox" id="sat" ${S.sat?'checked':''}> Include Saturday</label>
<p class="hint">The course is 511 lecture hours. Sessions 01–03 give 6 lecture hours a day (about 17 weeks at 5 days a week); the 3-hour night session is optional, counts when you assign a topic, and is not used by auto-fill.</p></section>
<section class="card"><h2>Training centres and centre managers</h2><table class="t"><tr><th>#<th>Centre name<th>Centre manager<th>Contact</tr>${S.C.map((c,i)=>`<tr><td>${i+1}<td><input data-c="${i}" data-f="n" value="${e(c.n)}"><td><input data-c="${i}" data-f="m" value="${e(c.m)}" placeholder="Manager name"><td><input data-c="${i}" data-f="p" value="${e(c.p)}" placeholder="Phone / email"></tr>`).join('')}</table></section>
<section class="card"><h2>Lecturer list (${S.L.length}, no limit)</h2>
<textarea id="bulk" placeholder="Type or paste names, one per line"></textarea><div class="bar" style="margin-top:6px"><button class="pri" data-act="addl">Add lecturers</button></div>
${S.L.length?`<table class="t"><tr><th>Name<th style="width:90px"></tr>${S.L.map(l=>`<tr><td><input data-l="${l.id}" data-f="n" value="${e(l.n)}"><td><button data-rm="${l.id}">Remove</button></tr>`).join('')}</table>`:'<p class="hint">No lecturers yet. You can also add them directly in step 2.</p>'}</section>`}
function vAsg(){const c=S.cur.c,all=act();
 return cbar()+`<div class="card"><b>${e(S.C[c].n)}</b> | Manager: ${e(S.C[c].m||'not set')}<p class="hint">Add one or more lecturers to each topic for this centre. Choose “New lecturer…” to type a new name. These lecturers are offered in the timetable and used by auto-fill.</p></div>
<table class="t"><tr><th>Topic<th style="width:60px">Hours<th>Lecturers for this centre</tr>${T.map((x,t)=>{const ids=S.A[c][t];
 return `<tr><td>T${t+1} ${e(x[0])}<td>${x[1]}<td>${ids.map(id=>`<span class="chip">${e(ln(id))}<button data-un="${c}|${t}|${id}" title="Remove">×</button></span>`).join('')}<select data-as="${c}|${t}"><option value="">+ add lecturer</option>${all.filter(id=>!ids.includes(id)).map(id=>`<option value="${id}">${e(ln(id))}</option>`).join('')}<option value="-9">New lecturer…</option></select></tr>`}).join('')}</table>
<div class="bar" style="margin-top:8px"><button data-act="cpall">Copy this centre’s lecturers to all centres</button></div>`}
function cell(c,w,d,i){const K=k(c,w,d,i),o=S.s[K]||{t:-1,l:-1,u:''},cf=o.l>=0?lecBusy(w,d,i,o.l,c):'';
 let ids=o.t===9?act():pool(c,o.t);if(o.l>=0&&!ids.includes(o.l))ids=[...ids,o.l];const ph=o.t<0?'– select topic first –':ids.length?'– lecturer –':'– none assigned (step 2) –';
 return `<td class="${cf?'cf':''}" style="${col(o.t)}"><select data-k="${K}" data-f="t"><option value="-1">– topic –${T.map((x,j)=>`<option value="${j}" ${o.t===j?'selected':''}>T${j+1} ${e(x[0])}`).join('')}<option value="9" ${o.t===9?'selected':''}>Assessment / Other</select><select data-k="${K}" data-f="l"><option value="-1">${ph}${ids.map(j=>`<option value="${j}" ${o.l===j?'selected':''}>${e(ln(j))}`).join('')}</select><input data-k="${K}" data-f="u" placeholder="Unit / note" value="${e(o.u)}"><label class="held"><input type="checkbox" data-k="${K}" data-f="h" ${o.h?'checked':''}> Session held</label>${cf?`<div class="w">Lecturer also at ${e(cf)}</div>`:''}</td>`}
function vTT(){const{c,w}=S.cur,C=S.C[c],n=nd(),D=[...Array(n).keys()];
 let h=cbar()+`<div class="bar noprint">${wbar()}<span class="sp"></span><button class="pri" data-act="auto">Auto-fill empty slots</button><button data-act="clrw">Clear this week</button><button data-act="clrc">Clear this centre</button><button onclick="print()">Print</button></div>
<div class="card"><b>${e(C.n)}</b> | Centre manager: ${e(C.m||'not set')}${C.p?' | '+e(C.p):''} | Week ${w+1}: ${fd(dt(w,0))} to ${fd(dt(w,n-1))}</div>
<div style="overflow:auto"><table class="t tt"><tr><th class="tm">Time${D.map(d=>`<th>${fd(dt(w,d),1)}<br><label class="noprint off"><input type="checkbox" data-off="${w}-${d}" ${S.off[w+'-'+d]?'checked':''}> day off</label>`).join('')}</tr>`;
 for(let i=0;i<SL.length;i++){(FX[i]||[]).forEach(f=>h+=`<tr class="fx"><th class="tm">${f[0]}<td colspan="${n}">${f[1]}</tr>`);
  h+=`<tr><th class="tm">${SL[i][0]}<br><small>${SL[i][1]}</small>${D.map(d=>S.off[w+'-'+d]?'<td class="offd">Day off':cell(c,w,d,i)).join('')}</tr>`}
 return h+'</table></div>'}
function vLec(){const w=S.cur.w,D=[...Array(nd()).keys()];
 return `<div class="bar noprint">${wbar()}<button onclick="print()">Print</button></div><div style="overflow:auto"><table class="t"><tr><th>Lecturer${D.map(d=>`<th colspan="4">${fd(dt(w,d),1)}`).join('')}</tr><tr><th>${D.map(()=>'<th class="lc">S1<th class="lc">S2<th class="lc">S3<th class="lc">Night').join('')}</tr>`+
 act().map(l=>`<tr><th>${e(ln(l))}${D.map(d=>[0,1,2,3].map(i=>{for(let c=0;c<NC;c++){const o=S.s[k(c,w,d,i)];if(o&&o.l===l)return `<td class="lc" style="${col(o.t)}" title="${e(S.C[c].n)}">${'ABCDEFG'[c]}${o.t>=0&&o.t<9?' T'+(o.t+1):''}`}return'<td class="lc">'}).join('')).join('')}</tr>`).join('')+`</table></div><p class="hint">A–G are the seven centres, T is the topic, S1–S3 are the day sessions and Night is the night session.</p>`}
function vSum(){const sc=S.C.map(()=>T.map(()=>0)),ld={};
 for(const K in S.s){const[c,w,d,i]=K.split('|').map(Number),o=S.s[K];if(i>=SL.length||w>=S.weeks||d>=nd())continue;const h=SL[i][2];if(o.t>=0&&o.t<9)sc[c][o.t]+=h;if(o.l>=0)ld[o.l]=(ld[o.l]||0)+h}
 const f=x=>+x.toFixed(2);
 return `<section class="card"><h2>Hours scheduled per topic and centre</h2><table class="t"><tr><th>Topic<th>Required${S.C.map(c=>`<th>${e(c.n)}`).join('')}</tr>${T.map((x,t)=>`<tr><td>T${t+1} ${e(x[0])}<td>${x[1]}${S.C.map((c,ci)=>`<td class="${sc[ci][t]>=x[1]?(sc[ci][t]>x[1]+1.5?'ov':'ok'):''}">${f(sc[ci][t])}`).join('')}</tr>`).join('')}</table><p class="hint">Green: topic hours covered. Amber: more than required.</p></section>
<section class="card"><h2>Hours covered (held sessions + manager entries)</h2><table class="t"><tr><th>Topic<th>Required${S.C.map(c=>`<th>${e(c.n)}`).join('')}</tr>${T.map((x,t)=>`<tr><td>T${t+1} ${e(x[0])}<td>${x[1]}${S.C.map((c,ci)=>`<td class="${cov(ci,t)>=x[1]?'ok':''}">${f(cov(ci,t))}`).join('')}</tr>`).join('')}</table></section>
<section class="card"><h2>Lecturer teaching hours</h2><table class="t"><tr><th>Lecturer<th>Hours</tr>${act().map(l=>`<tr><td>${e(ln(l))}<td>${f(ld[l]||0)}`).join('')}</table></section>`}
function auto(){const rem=S.C.map(()=>T.map(x=>x[1])),load={},lt=Array(NC).fill(-1),ll=Array(NC).fill(-1);
 for(const K in S.s){const[c,w,d,i]=K.split('|').map(Number),o=S.s[K];if(o.t>=0&&o.t<9&&i<SL.length)rem[c][o.t]-=SL[i][2];if(o.l>=0)load[o.l]=(load[o.l]||0)+SL[i][2]}
 for(let w=0;w<S.weeks;w++)for(let d=0;d<nd();d++){if(S.off[w+'-'+d])continue;
  for(let i=0;i<3;i++)for(let c=0;c<NC;c++){const K=k(c,w,d,i);if(S.s[K]&&S.s[K].t>=0)continue;
   const ord=[...Array(9).keys()].map(j=>(j+c*2)%9),cand=lt[c]>=0&&rem[c][lt[c]]>.01?[lt[c],...ord]:ord;
   for(const t of cand){if(rem[c][t]<=.01)continue;
    const p=pool(c,t).filter(l=>!lecBusy(w,d,i,l,c));if(!p.length)continue;
    const l=t===lt[c]&&p.includes(ll[c])?ll[c]:p.sort((a,b)=>(load[a]||0)-(load[b]||0))[0];
    S.s[K]={t,l,u:S.s[K]?.u||''};rem[c][t]-=SL[i][2];load[l]=(load[l]||0)+SL[i][2];lt[c]=t;ll[c]=l;break}}}
 const left=rem.reduce((a,r)=>a+r.reduce((x,y)=>x+Math.max(0,y),0),0);
 setTimeout(()=>alert(left>.01?`Auto-fill finished. ${+left.toFixed(2)} lecture hours are still unscheduled. Assign more lecturers to the topics (step 2), add weeks, or fill the gaps by hand.`:'Auto-fill finished. All required hours are scheduled.'),50)}
function expX(){if(!window.XLSX)return alert('The Excel library could not be loaded. Please check the internet connection.');
 const wb=XLSX.utils.book_new(),add=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),n);
 add('Settings',[{Setting:'Start date',Value:S.start},{Setting:'Weeks',Value:S.weeks},{Setting:'Include Saturday',Value:S.sat?'Yes':'No'}]);
 add('Centres',S.C.map((c,i)=>({Centre:i+1,Name:c.n,Manager:c.m,Contact:c.p})));
 add('Lecturers',S.L.map(l=>({Name:l.n})));
 add('Assignments',S.C.flatMap((c,ci)=>T.map((x,t)=>({Centre:c.n,'Topic No':t+1,Topic:x[0],Hours:x[1],Lecturers:S.A[ci][t].map(ln).join('; ')}))));
 add('Timetable',Object.keys(S.s).map(K=>K.split('|').map(Number)).sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2]||a[3]-b[3]).map(([c,w,d,i])=>({o:S.s[k(c,w,d,i)],c,w,d,i})).filter(x=>x.o.t>=0||x.o.l>=0||x.o.u||x.o.h).map(({o,c,w,d,i})=>({Centre:S.C[c].n,Week:w+1,'Day No':d+1,Date:fd(dt(w,d),1),'Slot No':i+1,Time:SL[i][0],'Topic No':o.t<0?'':o.t===9?'Other':o.t+1,Topic:o.t<0?'':o.t===9?'Assessment / Other':T[o.t][0],Lecturer:o.l<0?'':ln(o.l),Note:o.u,Held:o.h?'Yes':''})));
 add('DaysOff',Object.keys(S.off).filter(x=>S.off[x]).map(x=>{const[w,d]=x.split('-').map(Number);return{Week:w+1,'Day No':d+1}}));
 add('Progress',S.C.flatMap((c,ci)=>T.map((x,t)=>{const cv=cov(ci,t);return{Centre:c.n,'Topic No':t+1,Topic:x[0],Required:x[1],'Held hours':heldH(ci,t),'Manual hours':+S.P[ci][t].h||0,Covered:cv,Status:cv<=0?'Not started':cv>=x[1]?'Completed':'In progress',Remarks:S.P[ci][t].r||''}})));
 XLSX.writeFile(wb,'sltes2026_timetable.xlsx')}
function impX(buf){if(!window.XLSX)return alert('The Excel library could not be loaded. Please check the internet connection.');
 try{const wb=XLSX.read(buf,{type:'array'}),g=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''}):[],N=fresh(),
  lid=n=>{n=String(n).trim();if(!n)return -1;const l=N.L.find(x=>x.n.toLowerCase()===n.toLowerCase());if(l)return l.id;const id=N.nid++;N.L.push({id,n});return id},
  ci=n=>{const s=String(n).trim().toLowerCase(),j=N.C.findIndex(c=>c.n.toLowerCase()===s);return j>=0?j:(+s>=1&&+s<=NC?+s-1:-1)};
  g('Settings').forEach(r=>{const v=r.Value;if(r.Setting==='Start date')N.start=typeof v==='number'?new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10):String(v).slice(0,10);
   if(r.Setting==='Weeks')N.weeks=+v||20;if(r.Setting==='Include Saturday')N.sat=/^y/i.test(v)});
  g('Centres').forEach((r,i)=>{if(i<NC)N.C[i]={n:String(r.Name||N.C[i].n),m:String(r.Manager||''),p:String(r.Contact||'')}});
  g('Lecturers').forEach(r=>lid(r.Name));
  g('Assignments').forEach(r=>{const c=ci(r.Centre),t=+r['Topic No']-1;if(c<0||!(t>=0&&t<9))return;
   String(r.Lecturers).split(/[;,]/).map(lid).filter(x=>x>=0).forEach(id=>{if(!N.A[c][t].includes(id))N.A[c][t].push(id)})});
  g('Timetable').forEach(r=>{const c=ci(r.Centre),w=+r.Week-1,d=+r['Day No']-1,i=+r['Slot No']-1;if(c<0||!(w>=0&&d>=0&&d<6&&i>=0&&i<SL.length))return;
   const tn=r['Topic No'],t=tn===''?-1:/^o/i.test(String(tn))?9:(+tn>=1&&+tn<=9?+tn-1:-1);
   N.s[k(c,w,d,i)]={t,l:lid(r.Lecturer),u:String(r.Note||''),h:/^y/i.test(String(r.Held))};N.weeks=Math.max(N.weeks,w+1)});
  g('DaysOff').forEach(r=>{N.off[(+r.Week-1)+'-'+(+r['Day No']-1)]=true});
  g('Progress').forEach(r=>{const c=ci(r.Centre),t=+r['Topic No']-1;if(c<0||!(t>=0&&t<9))return;N.P[c][t]={h:+r['Manual hours']||0,r:String(r.Remarks||'')}});
  N.view='tt';S=N;R()}catch(x){alert('That file could not be read. Please use a file exported from this planner.')}}
document.addEventListener('change',ev=>{const t=ev.target,d=t.dataset;
 if(t.id==='imp'){const f=t.files[0];if(f){const r=new FileReader();r.onload=()=>impX(r.result);r.readAsArrayBuffer(f)}t.value='';return}
 if(t.id==='st')S.start=t.value;else if(t.id==='wk')S.weeks=+t.value||20;else if(t.id==='sat')S.sat=t.checked;
 else if(d.c!==undefined&&d.f){S.C[d.c][d.f]=t.value;save();return}
 else if(d.l!==undefined&&d.f){S.L.find(x=>x.id===+d.l).n=t.value;save();return}
 else if(d.p){const[c,tp]=d.p.split('|').map(Number);if(d.f==='r'){S.P[c][tp].r=t.value;save();return}S.P[c][tp].h=Math.max(0,+t.value||0)}
 else if(d.as){if(!t.value)return;const[c,tp]=d.as.split('|').map(Number);let id=+t.value;
  if(id===-9){const n=(prompt('New lecturer name')||'').trim();if(!n)return R();id=addL(n)}
  if(!S.A[c][tp].includes(id))S.A[c][tp].push(id)}
 else if(d.k&&d.f){const o=S.s[d.k]||(S.s[d.k]={t:-1,l:-1,u:''});o[d.f]=d.f==='u'?t.value:d.f==='h'?t.checked:+t.value;if(d.f==='u'){save();return}
  if(d.f==='t'&&o.l<0){const[c,w,dd,i]=d.k.split('|').map(Number),p=pool(c,o.t).filter(l=>!lecBusy(w,dd,i,l,c));if(p.length)o.l=p[0]}}
 else if(t.id==='wsel')S.cur.w=+t.value;
 else if(d.off)S.off[d.off]=t.checked;
 else return;R()});
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset,cc=S.cur;
 if(d.v)S.view=d.v;
 else if(d.go==='c')cc.c=+d.i;
 else if(d.go==='w')cc.w=Math.max(0,Math.min(S.weeks-1,+d.i));
 else if(d.act==='addl'){const n=$('#bulk').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!n.length)return;n.forEach(addL)}
 else if(d.rm){const id=+d.rm;if(!confirm('Remove '+ln(id)+' from the list and from all assignments?'))return;S.L=S.L.filter(x=>x.id!==id);S.A.forEach(r=>r.forEach((a,t)=>r[t]=a.filter(x=>x!==id)));for(const K in S.s)if(S.s[K].l===id)S.s[K].l=-1}
 else if(d.un){const[c,t,id]=d.un.split('|').map(Number);S.A[c][t]=S.A[c][t].filter(x=>x!==id)}
 else if(d.act==='cpall'){if(confirm('Replace the lecturers of the other centres with this centre’s list?'))S.A=S.A.map(()=>S.A[cc.c].map(a=>[...a]))}
 else if(d.act==='auto')auto();
 else if(d.act==='clrw'){if(confirm('Clear this week for this centre?'))for(const K in S.s){const p=K.split('|').map(Number);if(p[0]===cc.c&&p[1]===cc.w)delete S.s[K]}}
 else if(d.act==='clrc'){if(confirm('Clear the whole timetable of this centre?'))for(const K in S.s)if(+K.split('|')[0]===cc.c)delete S.s[K]}
 else if(d.act==='exp'){expX();return}
 else if(d.act==='imp'){$('#imp').click();return}
 else if(d.act==='rst'){if(confirm('Reset everything?'))S=fresh()}
 else return;R()});
R();
</script></body></html>
