name: SLTES Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-check:
    name: 🧪 CI Automated Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, json, openssl, tokenizer, xml, ctype
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Cache Composer Dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PHP Syntax
        run: |
          find app routes -type f -name "*.php" -exec php -l {} \;

  deploy:
    name: 🚀 CD Remote Server Deployment
    needs: quality-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Verify Deployment Configuration
        id: check_secrets
        run: |
          if [ -n "${{ secrets.SERVER_HOST }}" ]; then
            echo "has_ssh=true" >> $GITHUB_OUTPUT
            echo "SSH Host configured. Initiating remote server deployment..."
          else
            echo "has_ssh=false" >> $GITHUB_OUTPUT
            echo "::notice title=Deployment Notice::SERVER_HOST secret is not set. If you are using cPanel Git Version Control, your live site updates automatically via cPanel Webhook."
          fi

      - name: SSH & Trigger Production Update
        if: steps.check_secrets.outputs.has_ssh == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.SERVER_PATH }}
            chmod +x deploy.sh
            ./deploy.sh
